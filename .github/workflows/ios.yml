
name: NORD - Compilation automatique iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Dezipper, preparer et compiler NORD
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      # 1. Recuperer le depot GitHub
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      # 2. Decompresser automatiquement NORD
      - name: Extraire nord-1.zip
        run: |
          if [ ! -f nord-1.zip ]; then
            echo "::error::nord-1.zip introuvable a la racine du depot"
            exit 1
          fi

          unzip -q -o nord-1.zip

          if [ ! -f nord-1/package.json ]; then
            echo "::error::package.json introuvable"
            exit 1
          fi

          echo "Application NORD extraite avec succes"

      # 3. Installer Node.js
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nord-1/package-lock.json

      # 4. Installer les dependances
      - name: Installer les dependances NORD
        working-directory: nord-1
        run: npm ci

      # 5. Installer Capacitor iOS
      - name: Installer Capacitor iOS
        working-directory: nord-1
        run: |
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          npm install --no-save "@capacitor/ios@${CAP_VERSION}"

      # 6. Compiler l'application web
      - name: Construire NORD pour iOS
        working-directory: nord-1
        env:
          MOBILE_BUILD: "1"
        run: node scripts/with-app-env.mjs vite build

      # 7. Creer automatiquement le projet Xcode
      - name: Generer le projet iOS
        working-directory: nord-1
        run: node scripts/ios-setup.mjs

      # 8. Verifier le projet Xcode
      - name: Verifier Xcode
        working-directory: nord-1
        run: |
          test -d ios/App/App.xcworkspace
          xcodebuild -version
          xcodebuild -list -workspace ios/App/App.xcworkspace

      # 9. Compiler l'application iOS
      - name: Compiler NORD
        working-directory: nord-1
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/NORD.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 10. Generer le fichier IPA
      - name: Creer le fichier IPA
        run: |
          mkdir -p "$RUNNER_TEMP/pkg/Payload"

          cp -R "$RUNNER_TEMP/NORD.xcarchive/Products/Applications/App.app" \
            "$RUNNER_TEMP/pkg/Payload/"

          cd "$RUNNER_TEMP/pkg"

          zip -qry "$GITHUB_WORKSPACE/NORD-unsigned.ipa" Payload

          test -s "$GITHUB_WORKSPACE/NORD-unsigned.ipa"

      # 11. Publier le fichier IPA
      - name: Exporter le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: NORD-IPA
          path: NORD-unsigned.ipa
          retention-days: 30
          
