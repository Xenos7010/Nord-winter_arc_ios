
name: NORD - Build automatique IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Preparation et compilation NORD
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire automatiquement NORD
        run: |
          test -f nord-1.zip || exit 1
          unzip -q -o nord-1.zip
          test -f nord-1/package.json || exit 1

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nord-1/package-lock.json

      - name: Installer les dependances NORD
        working-directory: nord-1
        run: |
          node --version
          npm install --no-audit --no-fund
          test -x node_modules/.bin/vite

      - name: Installer Capacitor iOS
        working-directory: nord-1
        run: |
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          npm install --no-save "@capacitor/ios@${CAP_VERSION}" --no-audit --no-fund
          test -x node_modules/.bin/vite

      - name: Construire NORD
        working-directory: nord-1
        env:
          MOBILE_BUILD: "1"
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/with-app-env.mjs vite build

      - name: Generer le projet iOS
        working-directory: nord-1
        run: |
          node scripts/ios-setup.mjs

      - name: Verifier le projet Xcode
        working-directory: nord-1
        run: |
          test -d ios/App/App.xcworkspace
          xcodebuild -version
          xcodebuild -list -workspace ios/App/App.xcworkspace

      - name: Compiler NORD
        working-directory: nord-1
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/NORD.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Generer le fichier IPA
        run: |
          mkdir -p "$RUNNER_TEMP/pkg/Payload"
          cp -R "$RUNNER_TEMP/NORD.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/pkg/Payload/"
          cd "$RUNNER_TEMP/pkg"
          zip -qry "$GITHUB_WORKSPACE/NORD-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/NORD-unsigned.ipa"

      - name: Exporter le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: NORD-IPA
          path: NORD-unsigned.ipa
          retention-days: 30
          - name: Upload iOS IPA
  uses: actions/upload-artifact@v4
  with:
    name: Application-iOS-IPA
    path: |
      build/ios/ipa/*.ipa
    retention-days: 30
